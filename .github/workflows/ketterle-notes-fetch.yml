name: Ketterle Course Notes Fetch

on:
  push:
    branches: [main]
    paths:
      - tools/ketterle_fetch.py
      - .github/workflows/ketterle-notes-fetch.yml
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/ketterle_fetch.py ketterle_raw
      - if: always()
        run: find ketterle_raw -maxdepth 4 -type f -printf '%p %s bytes\n' | sort || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ketterle-raw-notes
          path: ketterle_raw
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1
